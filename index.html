<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Events - Prossimi Eventi</title>
    <!-- Script ufficiale di Telegram per la Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #00ffcc;
        }
        p.subtitle {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        .event-card {
            background: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: left;
        }
        .event-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .event-info {
            padding: 15px;
        }
        .event-date {
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .event-title {
            font-size: 16px;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .event-desc {
            font-size: 13px;
            color: #cccccc;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>📅 PROSSIMI EVENTI</h1>
    <p class="subtitle">I portali dell'intrattenimento si aprono...</p>

    <div class="grid">
        
        <!-- EVENTO 1 (Puoi modificare data, titolo e descrizione qui sotto) -->
        <div class="event-card">
            <!-- Sostituisci "locandina1.jpg" con il nome esatto del file immagine che carichi su GitHub -->
            <img src="locandina1.jpg" alt="Locandina Evento">
            <div class="event-info">
                <div class="event-date">📍 Roma / Pordenone / Udine</div>
                <div class="event-title">Nome del Serata o del Locale</div>
                <div class="event-desc">
                    Breve descrizione dell'evento: dettagli sulla serata, orari o informazioni utili per i partecipanti.
                </div>
            </div>
        </div>

        <!-- SE VUOI AGGIUNGERE UN SECONDO EVENTO IN FUTURO, TI BASTERÀ COPIARE E INCOLLARE QUI SOTTO UN ALTRO BLOCCO SIMILE -->

    </div>

    <script>
        // Inizializza la Mini App di Telegram e la espande
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
